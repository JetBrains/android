syntax = "proto3";

package ij.qsync;

import "querysummary.proto";
import "language_class.proto";

// option java_api_version = 2;
option java_outer_classname = "SnapshotProto";
option java_package = "com.google.idea.blaze.qsync.project";

message Snapshot {
  ProjectDefinition project_definition = 1;
  VcsState vcs_state = 2;
  Summary query_summary = 3;
  int32 version = 4;
  string bazel_version = 5;
  ProjectStructureData project_structure_data = 6;
}

message ProjectDefinition {
  repeated string include_paths = 1;
  repeated string exclude_paths = 2;
  bool derive_targets_from_directories = 6;
  repeated string target_patterns = 7;
  repeated LanguageClass language_classes = 3;
  bool is_android_workspace = 8;
  repeated string test_sources = 4;
  // TODO(b/382333575): improve excluding system folders
  repeated string system_excludes = 5;
}

message VcsState {
  string upstream_revision = 1;
  repeated WorkspaceFileChange working_set = 2;
  WorkspaceSnapshot workspace_snapshot = 3;
  string workspace_id = 4;
}

message WorkspaceFileChange {
  enum VcsOperation {
    UNSPECIFIED = 0;
    DELETE = 1;
    ADD = 2;
    MODIFY = 3;
  }

  VcsOperation operation = 1;
  string workspace_relative_path = 2;
}

message WorkspaceSnapshot {
  string path = 1;
}

message ProjectStructureData {
  repeated ProjectStructureRoot roots = 3;
  repeated LanguageClass active_languages = 2;
}

message ProjectStructureRoot {
  string project_structure_root_path = 1;
  repeated BuildPackage build_packages = 3;
}

message BuildPackage {
  string build_package_path = 1;
  repeated SourceSet source_sets = 2;
}

message SourceSet {
  repeated string java_source_files = 2;
  repeated string non_java_source_files = 3;
  string root_path = 4;
  string java_package = 5;
}
