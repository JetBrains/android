buildscript {
    repositories {
        // This will be populated by AndroidGradleTestCase
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:1.5.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply plugin: 'com.android.application'

repositories {
  mavenCentral()
}

dependencies {
    api 'com.android.support:support-v4:28.0.0'
    debugApi 'com.android.support:support-v13:28.0.0'
}

android {
    compileSdkVersion 22

    testBuildType = "debug"

    signingConfigs {
        myConfig {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        versionCode 12
        versionName "2.0"
        minSdkVersion 16
        targetSdkVersion 22

        testInstrumentationRunner "android.test.InstrumentationTestRunner"
        testHandleProfiling = false

        buildConfigField "boolean", "DEFAULT", "true"
        buildConfigField "String", "FOO", "\"foo\""
        buildConfigField "String", "FOO", "\"foo2\""

        resValue "string", "foo", "foo"

        resConfig "en"
        resConfigs "nodpi", "hdpi"
    }

    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
            signingConfig = signingConfigs.myConfig

            testCoverageEnabled = true

            buildConfigField "String", "FOO", "\"bar1\""
            buildConfigField "String", "FOO", "\"bar\""

            resValue "string", "foo", "foo2"
        }
    }

    aaptOptions {
        noCompress 'txt'
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~"
    }

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    // Override the versionCode of the release version
    applicationVariants.all { variant ->
        if (variant.buildType.name == "release") {
            variant.outputs.collect().get(0).versionCodeOverride = 13
        }
    }
}

assert java.awt.GraphicsEnvironment.getLocalGraphicsEnvironment().isHeadlessInstance();
