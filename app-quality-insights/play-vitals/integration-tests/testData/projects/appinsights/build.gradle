buildscript {
    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.10"
    }
}

apply plugin: 'com.android.application'

android {
    compileSdk 33
    defaultConfig {
        namespace "com.example.minapp"
        minSdk 26
    }
}
