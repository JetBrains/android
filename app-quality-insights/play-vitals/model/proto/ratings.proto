syntax = "proto3";

package google.play.developer.reporting.v1beta1;

import "metrics.proto";

option java_multiple_files = true;
option java_outer_classname = "RatingsProto";
option java_package = "com.google.play.developer.reporting";

// Singleton resource representing the set of average ratings metrics.
//
// This metric set contains daily and lifetime average ratings for a given app.
//
// **Supported aggregation periods:**
//
//  * [DAILY][google.play.developer.reporting.v1beta1.AggregationPeriod.DAILY]:
//    metrics are aggregated in calendar date intervals in the Google Standard
//    Time Zone (America/Los_Angeles).
//
// **Supported metrics:**
//
//  * `dailyAverageRating` (`google.type.Decimal`): Average rating that your app
//  receives each day.
//  * `lifetimeAverageRating` (`google.type.Decimal`): Average rating that your
//  app has received over its lifetime.
//
// **Supported dimensions:**
//
//  * `apiLevel`
//     ([string][google.play.developer.reporting.v1beta1.DimensionValue.string_value]):
//     The API level of Android that was running on the user's device.
//  * `deviceModel`
//     ([string][google.play.developer.reporting.v1beta1.DimensionValue.string_value]):
//     Unique identifier of the user's device model. The form of the
//     identifier is 'deviceBrand/device', where deviceBrand corresponds
//     to Build.BRAND and device corresponds to Build.DEVICE, e.g.,
//     google/coral.
//  * `deviceBrand`
//     ([string][google.play.developer.reporting.v1beta1.DimensionValue.string_value]):
//     unique identifier of the user's device brand, e.g., google.
//  * `deviceType`
//     ([string][google.play.developer.reporting.v1beta1.DimensionValue.string_value]):
//     The form factor of the user's device (e.g., PHONE, TABLET, CHROMEBOOK).
//  * `languageCode`
//     ([string][google.play.developer.reporting.v1beta1.DimensionValue.string_value]):
//     The user's device language, represented as a BCP-47 language tag (e.g.
//     en-US for English as used in the United States).
//  * `regionCode`
//     ([string][google.play.developer.reporting.v1beta1.DimensionValue.string_value]):
//     The country or region of the user's device, represented as a 2-letter
//     Unicode CLDR region code (e.g. US for the United States).
//  * `versionCode`
//     ([int64][google.play.developer.reporting.v1beta1.DimensionValue.int64_value]):
//     The version of the app that was running on the user's device.
//  * `carrier`
//    ([string][google.play.developer.reporting.v1beta1.DimensionValue.string_value]):
//    The mobile carrier or network of the user's device
// (== resource_for v1beta1.ratings ==)
message AverageRatingsMetricSet {
  // The resource name.
  string name = 1;

  // Summary about data freshness in this resource.
  FreshnessInfo freshness_info = 2;
}

// Request message for [GetAverageRatingsMetricSet].
message GetAverageRatingsMetricSetRequest {
  // The resource name.
  // Format: apps/{app}/averageRatingsMetricSet
  string name = 1;
}

// Request message for [QueryAverageRatingsMetricSet].
message QueryAverageRatingsMetricSetRequest {
  // The resource name.
  string name = 1;

  // Specification of the timeline aggregation parameters.
  //
  // **Supported aggregation periods:**
  //
  //  * [DAILY][google.play.developer.reporting.v1beta1.AggregationPeriod.DAILY]:
  //    metrics are aggregated in calendar date intervals in the Google Standard
  //    Time Zone (America/Los_Angeles).
  TimelineSpec timeline_spec = 2;

  // **Supported dimensions:**
  //
  //  * `apiLevel`
  //     ([string][google.play.developer.reporting.v1beta1.DimensionValue.string_value]):
  //     The API level of Android that was running on the user's device.
  //  * `deviceModel`
  //     ([string][google.play.developer.reporting.v1beta1.DimensionValue.string_value]):
  //     Unique identifier of the user's device model. The form of the
  //     identifier is 'deviceBrand/device', where deviceBrand corresponds
  //     to Build.BRAND and device corresponds to Build.DEVICE, e.g.,
  //     google/coral.
  //  * `deviceBrand`
  //     ([string][google.play.developer.reporting.v1beta1.DimensionValue.string_value]):
  //     unique identifier of the user's device brand, e.g., google.
  //  * `deviceType`
  //     ([string][google.play.developer.reporting.v1beta1.DimensionValue.string_value]):
  //     The form factor of the user's device (e.g., PHONE, TABLET, CHROMEBOOK).
  //  * `languageCode`
  //     ([string][google.play.developer.reporting.v1beta1.DimensionValue.string_value]):
  //     The user's device language, represented as a BCP-47 language tag (e.g.
  //     en-US for English as used in the United States).
  //  * `regionCode`
  //     ([string][google.play.developer.reporting.v1beta1.DimensionValue.string_value]):
  //     The country or region of the user's device, represented as a 2-letter
  //     Unicode CLDR region code (e.g. US for the United States).
  //  * `versionCode`
  //     ([int64][google.play.developer.reporting.v1beta1.DimensionValue.int64_value]):
  //     The version of the app that was running on the user's device.
  //  * `carrier`
  //    ([string][google.play.developer.reporting.v1beta1.DimensionValue.string_value]):
  //    The mobile carrier or network of the user's device
  repeated string dimensions = 3;

  // Metrics to aggregate.
  //
  // **Supported metrics:**
  //
  //  * `dailyAverageRating` (`google.type.Decimal`): Average rating that your
  //  app receives each day.
  //  * `lifetimeAverageRating` (`google.type.Decimal`): Average rating that
  //  your app has received over its lifetime.
  //
  repeated string metrics = 4;

  // Filters to apply to data. The filtering expression follows
  // [AIP-160](https://google.aip.dev/160) standard and supports filtering
  // by equality of all breakdown dimensions.
  string filter = 7;

  // Maximum size of the returned data.
  //
  // If unspecified, at most 1000 rows will be returned.
  // The maximum value is 100,000; values above 100,000 will be coerced to
  // 100,000.
  int32 page_size = 5;

  // A page token, received from a previous call.
  // Provide this to retrieve the subsequent page.
  //
  // When paginating, all other parameters provided to the request must
  // match the call that provided the page token.
  string page_token = 6;
}

// Response message for [QueryAverageRatingsMetricSet].
message QueryAverageRatingsMetricSetResponse {
  // The returned rows of metrics.
  repeated MetricsRow rows = 1;

  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Singleton resource representing the set of google play rating metrics.
//
// This metric set contains your app rating shown to users on Google Play.
//
// **Supported aggregation periods:**
//
//  * [DAILY][google.play.developer.reporting.v1beta1.AggregationPeriod.DAILY]:
//    metrics are aggregated in calendar date intervals in the Google Standard
//    Time Zone (America/Los_Angeles).
//
// **Supported metrics:**
//
//  * `googlePlayRating` (`google.type.Decimal`): Your app rating shown to users
//  on Google Play. This is calculated based on your most recent ratings and is
//  calculated per country. In countries, where we're unable to show a local
//  rating, a default Google Play rating, based on your most recent ratings
//  across all countries, is shown instead.
//
// **Supported dimensions:**
//
//  * `deviceType`
//     ([string][google.play.developer.reporting.v1beta1.DimensionValue.string_value]):
//     The form factor of the user's device (e.g., PHONE, TABLET, CHROMEBOOK).
//  * `regionCode`
//     ([string][google.play.developer.reporting.v1beta1.DimensionValue.string_value]):
//     The country or region of the user's device, represented as a 2-letter
//     Unicode CLDR region code (e.g. US for the United States).
// (== resource_for v1beta1.googlePlayRating ==)
message GooglePlayRatingMetricSet {
  // The resource name.
  string name = 1;

  // Summary about data freshness in this resource.
  FreshnessInfo freshness_info = 2;
}

// Request message for [GetGooglePlayRatingMetricSet].
message GetGooglePlayRatingMetricSetRequest {
  // The resource name.
  // Format: apps/{app}/googlePlayRatingMetricSet
  string name = 1;
}

// Request message for [QueryGooglePlayRatingMetricSet].
message QueryGooglePlayRatingMetricSetRequest {
  // The resource name.
  string name = 1;

  // Specification of the timeline aggregation parameters.
  //
  // **Supported aggregation periods:**
  //
  //  * [DAILY][google.play.developer.reporting.v1beta1.AggregationPeriod.DAILY]:
  //    metrics are aggregated in calendar date intervals in the Google Standard
  //    Time Zone (America/Los_Angeles).
  TimelineSpec timeline_spec = 2;

  // **Supported dimensions:**
  //
  //  * `deviceType`
  //     ([string][google.play.developer.reporting.v1beta1.DimensionValue.string_value]):
  //     The form factor of the user's device (e.g., PHONE, TABLET, CHROMEBOOK).
  //  * `regionCode`
  //     ([string][google.play.developer.reporting.v1beta1.DimensionValue.string_value]):
  //     The country or region of the user's device, represented as a 2-letter
  //     Unicode CLDR region code (e.g. US for the United States).
  repeated string dimensions = 3;

  // Metrics to aggregate.
  //
  // **Supported metrics:**
  //
  //  * `googlePlayRating` (`google.type.Decimal`): Your app rating shown to
  //  users
  //  on Google Play. This is calculated based on your most recent ratings. In
  //  countries, where we're unable to show a local rating, a default Google
  //  Play rating, based on your most recent ratings across all countries, is
  //  shown instead.
  repeated string metrics = 4;

  // Filters to apply to data. The filtering expression follows
  // [AIP-160](https://google.aip.dev/160) standard and supports filtering
  // by equality of all breakdown dimensions.
  string filter = 7;

  // Maximum size of the returned data.
  //
  // If unspecified, at most 1000 rows will be returned.
  // The maximum value is 100,000; values above 100,000 will be coerced to
  // 100,000.
  int32 page_size = 5;

  // A page token, received from a previous call.
  // Provide this to retrieve the subsequent page.
  //
  // When paginating, all other parameters provided to the request must
  // match the call that provided the page token.
  string page_token = 6;
}

// Response message for [QueryGooglePlayRatingMetricSet].
message QueryGooglePlayRatingMetricSetResponse {
  // The returned rows of metrics.
  repeated MetricsRow rows = 1;

  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}
