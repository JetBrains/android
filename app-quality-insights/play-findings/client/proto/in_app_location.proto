syntax = "proto3";

package google.play.androidpublisher.v3;

option java_package = "com.google.play.androidpublisher.v3";
option java_multiple_files = true;
option java_outer_classname = "InAppLocationProto";

// A location within the app that this finding refers to.
message InAppLocation {

  // A reference to an uploaded artifact (an Android App Bundle or APK).
  message Artifact {

    // The version code of the artifact.
    string version_code = 1;
  }

  // A reference to a release.
  message Release {

    // The name of the release.
    string release_name = 1;
  }

  // The type of location.
  oneof location_type {
    // An artifact location.
    Artifact artifact = 1;

    // A release location.
    Release release = 2;
  }
}
