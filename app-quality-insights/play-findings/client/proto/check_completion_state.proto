syntax = "proto3";

package google.play.androidpublisher.v3;

option java_package = "com.google.play.androidpublisher.v3";
option java_multiple_files = true;
option java_outer_classname = "CheckCompletionStateProto";

// The status of checks which produce findings.
enum CheckCompletionState {

  // Unspecified status.
  CHECK_COMPLETION_STATE_UNSPECIFIED = 0;
  // One or more checks are still running.
  CHECK_COMPLETION_STATE_RUNNING = 1;
  // All checks have completed.
  CHECK_COMPLETION_STATE_COMPLETE = 2;
}
