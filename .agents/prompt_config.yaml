DOMAIN_INSTRUCTIONS: |
  IntelliJ Plugin Development: Agent Instructions
  
  To maximize efficiency when building for the **IntelliJ Platform**, your AI agents should adhere to these domain-specific constraints:

  ## API & Threading Rules
  *   **Threading:** Don't use runReadAction, use the non-blocking readAction instead
  *   **Disposables:** Always associate UI components or message bus connections with a `Disposable` parent to prevent memory leaks.
  *   **Virtual Files:** Use `VirtualFile` for I/O operations; avoid `java.io.File` to maintain compatibility with the IntelliJ File System (VFS).

  ## UI & Component Guidelines
  *   **Actions:** Register all user-facing commands in `plugin.xml` under `<actions>` for proper keymap integration.

  ## Testing & Debugging
  *   **Headless Environment:** Use `UsefulTestCase` or `BasePlatformTestCase` for integration tests.
  *   **Logging:** Use `com.intellij.openapi.diagnostic.Logger` for errors; avoid `System.out.println`.
