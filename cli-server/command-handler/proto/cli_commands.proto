syntax = "proto3";

package android.studio.cli.handlers;

option java_multiple_files = true;
option java_package = "com.android.tools.idea.cli.studio";
option java_outer_classname = "CliCommandsProto";

enum CommandType {
  UNKNOWN = 0;
  OPEN_FILE = 1;
  FIND_DECLARATION = 2;
  FIND_USAGES = 3;
  RENDER_COMPOSE_PREVIEW = 4;
  ANALYZE_FILE = 5;
  VERSION_LOOKUP = 6;
}


// Represents a specific point in a source file.
message Location {
  string file_path = 1;
  int32 line = 2;
  int32 column = 3;
  string snippet = 4;
}

message OpenFileRequest {
    string filePath = 1;
}

message OpenFileResponse {}

message FindDeclarationRequest {
  Location location = 1;
}

message FindDeclarationResponse {
  Location location = 1;
}

message FindUsagesRequest {
  string symbol = 1;
  string context_file = 2;
}

message FindUsagesResponse {
  repeated Location usages = 1;
  string project_path = 2;
}

message RenderComposePreviewRequest {
  string file_path = 1;
  string composable = 2;
}

message RenderComposePreviewResponse {
  bytes image_data = 1;
  string semantics = 2;
}

message AnalyzeFileRequest {
  string file_path = 1;
}


message Diagnostic {
  Location location = 1;
  string message = 2;
  Severity severity = 3;

  enum Severity {
    UNKNOWN = 0;
    INFO = 1;
    WARNING = 2;
    ERROR = 3;
  }
}

message AnalyzeFileResponse {
  repeated Diagnostic diagnostics = 1;
}

message VersionLookupRequest {
  repeated string artifacts = 1;
}

enum VersionLookupType {
  UNKNOWN_VERSION_LOOKUP_TYPE = 0;
  ANDROID = 1;
  STUDIO = 2;
  GRADLE = 3;
  MAVEN_ARTIFACT = 4;
  GRADLE_PLUGIN = 5;
  SDK = 6;
  EMULATOR = 7;
  PLATFORM_TOOLS = 8;
  CMDLINE_TOOLS = 9;
  BUILD_TOOLS = 10;
  NDK = 11;
  ADB = 12;
  AGP = 13;
  KOTLIN = 14;
  COMPOSE = 15;
}

message VersionLookupResult {
  string artifact = 1;
  string stable_version = 2;
  string preview_version = 3;
  VersionLookupType type = 4;
}

message VersionLookupResponse {
  repeated VersionLookupResult results = 1;
}


